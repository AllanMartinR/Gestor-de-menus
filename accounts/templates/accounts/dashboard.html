<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio | SICSA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">SICSA — Gestor de menús</span>
            <form method="post" action="{% url 'logout' %}" class="d-flex mb-0">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </nav>
    <div class="container py-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h1 class="h4">Bienvenido, {{ user.get_username }}</h1>
                <p class="text-muted mb-0">
                    Los módulos de ingredientes, platillos y menús se habilitarán en esta pantalla.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
